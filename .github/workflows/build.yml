name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake libffi-dev libltdl-dev libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev
        pip install --upgrade "cython<3.0.0" virtualenv buildozer

    - name: Generate buildozer.spec
      run: |
        buildozer init
        # Pygame और सही NDK वर्जन सेट करने के लिए ऑटो-रिप्लेसमेंट
        sed -i 's/requirements = python3,kivy/requirements = python3,pygame/' buildozer.spec
        sed -i 's/#android.ndk = 25b/android.ndk = 25b/' buildozer.spec
        sed -i 's/android.api = 31/android.api = 33/' buildozer.spec

    - name: Build with Buildozer
      run: |
        YES=1 buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Android-APK
        path: bin/*.apk
