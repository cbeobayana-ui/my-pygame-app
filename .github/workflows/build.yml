name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake libffi-dev libltdl-dev libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev

    - name: Install Python Tools
      run: |
        pip install --upgrade "cython<3.0.0" virtualenv buildozer

    - name: Fix Aidl and Licenses
      run: |
        yes | sdkmanager --sdk_root=$ANDROID_HOME "build-tools;33.0.2" "platforms;android-33" "platform-tools"
        mkdir -p ~/.buildozer/android/platform/
        ln -s $ANDROID_HOME ~/.buildozer/android/platform/android-sdk

    - name: Initialize Buildozer
      run: |
        buildozer init
        sed -i 's/requirements = python3,kivy/requirements = python3,pygame/' buildozer.spec
        sed -i 's/#android.ndk = 25b/android.ndk = 25b/' buildozer.spec
        sed -i 's/android.api = 31/android.api = 33/' buildozer.spec

    - name: Compile APK
      run: |
        export APP_ANDROID_ACCEPT_SDK_LICENSE=1
        yes | buildozer -v android debug

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: My-Android-App
        path: bin/*.apk
