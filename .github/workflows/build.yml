name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake libffi-dev libltdl-dev libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev

    - name: Install Python Tools
      run: |
        pip install --upgrade "cython<3.0.0" virtualenv buildozer

    - name: Pre-install Android SDK Tools (Fix for Aidl error)
      run: |
        mkdir -p ~/.buildozer/android/platform
        cd ~/.buildozer/android/platform
        # Android Command Line Tools डाउनलोड करना
        wget https://google.com
        unzip commandlinetools-linux-9477386_latest.zip -d cmdline-tools
        mkdir -p cmdline-tools/latest
        mv cmdline-tools/cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
        # aidl और बाकी टूल्स को पहले से इंस्टॉल करना
        yes | ./cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/.buildozer/android/platform/android-sdk "build-tools;33.0.2" "platforms;android-33" "platform-tools"

    - name: Initialize Buildozer
      run: |
        buildozer init
        sed -i 's/requirements = python3,kivy/requirements = python3,pygame/' buildozer.spec
        sed -i 's/#android.ndk = 25b/android.ndk = 25b/' buildozer.spec
        sed -i 's/android.api = 31/android.api = 33/' buildozer.spec

    - name: Compile APK
      run: |
        export APP_ANDROID_ACCEPT_SDK_LICENSE=1
        # पर्यावरण पाथ में aidl को शामिल करना
        export PATH=$PATH:$HOME/.buildozer/android/platform/android-sdk/build-tools/33.0.2
        yes | buildozer -v android debug

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: My-Android-App
        path: bin/*.apk
